<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半沉浸英讀">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>半沉浸式英語閱讀</title>
<style>
:root {
  --bg: #faf7f0; --fg: #2b2620; --muted: #8a8174; --line: #e6dfd2;
  --card: #ffffff; --accent: #b4532a; --accent-bg: #f6e6dc; --known: #9aa48c;
  --serif: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
  --sans: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
:root[data-theme="sepia"] { --bg: #f1e7d0; --fg: #3b2f22; --muted: #85745c; --line: #dccdae; --card: #f8f0dd; --accent: #9c3f17; --accent-bg: #e9d4b8; }
:root[data-theme="dark"] { --bg: #16140f; --fg: #e4ddd0; --muted: #8f8676; --line: #2e2a22; --card: #211e18; --accent: #f0956a; --accent-bg: #3a2519; --known: #7f8a72; }
:root[data-theme="green"] { --bg: #e3eddc; --fg: #26301f; --muted: #6d7a62; --line: #c8d6bc; --card: #eef4e8; --accent: #3f6b2a; --accent-bg: #cfe0c2; }
:root[data-theme="black"] { --bg: #000000; --fg: #d6d3cc; --muted: #7d7a73; --line: #1f1f1f; --card: #111111; --accent: #f0956a; --accent-bg: #2a1a12; --known: #7f8a72; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --bg: #16140f; --fg: #e4ddd0; --muted: #8f8676; --line: #2e2a22; --card: #211e18; --accent: #f0956a; --accent-bg: #3a2519; --known: #7f8a72; }
}
/* 使用者自選：英文字顏色、內文字體、英文字體、行距(由 app.js 設定) */
:root { --word: var(--accent); --body-font: var(--serif); --en-font: Georgia, "Times New Roman", serif; --en-style: italic; --lh: 1.9; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 8px;
}
header .t { flex: 1; min-width: 0; }
header .book { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .chap { font-size: 15px; font-weight: 600; }
.iconbtn {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; height: 36px; min-width: 36px; padding: 0 10px; font-size: 14px; cursor: pointer;
}

main { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
main p {
  font-family: var(--body-font); font-size: var(--fs, 19px); line-height: var(--lh);
  margin: 0 0 0.9em; text-align: justify; word-break: break-word;
}
.w {
  color: var(--word); font-family: var(--en-font); font-style: var(--en-style);
  padding: 0 2px; border-radius: 4px; cursor: pointer;
  text-decoration: underline dotted; text-underline-offset: 4px;
}
.w:active, .w.on { background: color-mix(in srgb, var(--word) 20%, transparent); }
.s {
  font-family: Georgia, "Times New Roman", serif; cursor: pointer;
  border-left: 3px solid var(--accent); padding-left: 10px; display: block;
}
.s .orig { display: none; font-family: var(--serif); color: var(--muted); font-size: 0.85em; margin-top: 4px; }
.s.show .orig { display: block; }
.src { font-size: 12px; color: var(--muted); text-align: center; margin-top: 32px; word-break: break-all; }
.src a { color: var(--muted); }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}
.dock .row { max-width: 680px; margin: 0 auto; }
.dock .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.dock .lab b { color: var(--fg); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 2px; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
  border-radius: 16px 16px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .22s ease; max-height: 75vh; overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,.15);
}
.sheet.open { transform: none; }
.sheet .inner { max-width: 640px; margin: 0 auto; }
.sheet h2 { margin: 0; font-family: Georgia, serif; font-size: 28px; }
.sheet .ipa { color: var(--muted); font-size: 15px; margin: 2px 0 12px; }
.sheet .kv { font-size: 15px; line-height: 1.7; }
.sheet .kv span { color: var(--muted); display: inline-block; width: 4.5em; }
.sheet .kv .col { font-family: Georgia, serif; font-style: italic; cursor: pointer; text-decoration: underline dotted; }
.sheet .btns { display: flex; gap: 10px; margin-top: 16px; }
.sheet .btns button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; cursor: pointer; }
.sheet .btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.list { margin: 8px 0 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .en { font-family: Georgia, serif; font-size: 17px; cursor: pointer; }
[data-open] { cursor: pointer; }
.list .zh { color: var(--muted); font-size: 13px; flex: 1; }
.list li.k .en { color: var(--known); text-decoration: line-through; }
.list button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.seg { display: flex; gap: 8px; margin: 10px 0 16px; }
.seg button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; }
.seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.sub { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
/* 單字卡：搭配詞、同義字小表格 */
.mini-h { font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
.mini td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.mini td.col { font-family: Georgia, serif; font-style: italic; cursor: pointer; color: var(--word); padding-left: 0; width: 45%; }
.mini td.lv { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; padding-right: 0; }
/* 目錄 */
.toc-top { position: sticky; top: -18px; z-index: 1; background: var(--card); margin: -18px 0 0; padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
.toc-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.toc-tools { margin-top: 10px; }
.toc-tools input { height: 40px; font-size: 16px; }
.toc-tools .clip { height: 40px; }
.toc-jump { display: flex; gap: 6px; margin: 8px 0 4px; }
.toc-jump button { flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 13px; cursor: pointer; }
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { display: flex; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.toc li[hidden] { display: none; }
.toc li .n { flex: none; width: 3em; color: var(--muted); font-size: 12px; text-align: right; padding-top: 2px; }
.toc li .t { flex: 1; min-width: 0; }
.toc li.read .t { color: var(--muted); }
.toc li.cur, .toc li.cur .n { color: var(--word); font-weight: 700; }

/* ---- 首頁 ---- */
body.home .dock, body.home #btnWords, body.home #btnToc, body.home header .t > div { display: none; }
body.home { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.hero { padding: 8px 0 4px; }
.hero h1 { margin: 0; font-family: var(--body-font); font-size: 26px; letter-spacing: .02em; }
.hero p { margin: 6px 0 14px; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
.stats b { display: block; font-size: 22px; font-family: Georgia, serif; color: var(--word); }
.stats span { font-size: 12px; color: var(--muted); }
.err { color: var(--accent); font-size: 14px; background: var(--accent-bg); padding: 10px 12px; border-radius: 10px; }
.add { display: flex; gap: 8px; margin-top: 14px; }
.add input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 0 12px; font-size: 16px; }
.add button { height: 46px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--word); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.add.epub { justify-content: center; align-items: center; height: 46px; border-radius: 12px; border: 1px dashed var(--line); color: var(--fg); font-size: 15px; cursor: pointer; margin-top: 10px; }
.shelf-h { font-size: 16px; margin: 26px 0 10px; }
.shelf { display: grid; gap: 10px; }
.bk { position: relative; display: flex; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
.bk:active { transform: scale(.99); }
.cover { flex: none; width: 56px; height: 76px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--body-font); font-size: 26px; box-shadow: inset -6px 0 0 rgba(0,0,0,.12); }
.info { flex: 1; min-width: 0; padding-right: 22px; }
.info .name { font-weight: 700; font-size: 16px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.info .where { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--word); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.chip.hot { background: color-mix(in srgb, var(--word) 14%, transparent); border-color: transparent; color: var(--word); font-weight: 600; }
.more { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.find { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--muted); }
.find .site { padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.find .site.off { background: var(--card); color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.find button.site { font: inherit; font-size: 14px; cursor: pointer; }
#browser { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--bg); }
#browser[hidden] { display: none; }
body.browsing { overflow: hidden; }
.brbar { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; border-bottom: 1px solid var(--line); background: var(--card); }
.brbar button { font: inherit; border: 0; background: none; color: var(--word); font-size: 16px; padding: 6px 8px; cursor: pointer; }
#brBack { font-size: 26px; line-height: 1; padding: 0 10px 4px; }
#brTitle { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#brFrame { flex: 1; width: 100%; border: 0; background: #fff; }
.fabs { position: absolute; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.fab { font: inherit; font-size: 15px; font-weight: 700; padding: 13px 18px; border-radius: 999px; border: 0; background: var(--word); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; }
.fab.done { background: var(--card); color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
.fab.ghost { background: var(--card); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
.fab[hidden] { display: none; }
.add .clip { padding: 0 12px; background: var(--card); border: 1px solid var(--line); color: var(--fg); font-weight: 400; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row2 .add.epub { margin-top: 10px; background: none; font-family: inherit; }
.field { width: 100%; margin-top: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 10px 12px; font-size: 16px; font-family: inherit; }
textarea.field { resize: vertical; line-height: 1.6; }
.empty, .foot { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 20px; }

/* ---- 新首頁(色票：藍 1E459F、紅 CF2A2A、黃 FABD32、米 E1DCCA) ---- */
:root {
  --h-bg: #f6f1e6; --h-card: #fffdf8; --h-sand: #e1dcca; --h-ink: #1e459f; --h-text: #2a2f3d;
  --h-muted: #847d6c; --h-red: #cf2a2a; --h-yel: #fabd32; --h-page: #fbf7ee; --h-shadow: rgba(30, 69, 159, .16);
  --round: "Fredoka", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
:root[data-theme="dark"], :root[data-theme="black"] {
  --h-bg: #11151f; --h-card: #1a2030; --h-sand: #262d40; --h-ink: #9db6f0; --h-text: #e3e6ee;
  --h-muted: #8d93a3; --h-red: #e8534f; --h-yel: #f5c04a; --h-page: #d9d2c0; --h-shadow: rgba(0, 0, 0, .45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --h-bg: #11151f; --h-card: #1a2030; --h-sand: #262d40; --h-ink: #9db6f0; --h-text: #e3e6ee;
    --h-muted: #8d93a3; --h-red: #e8534f; --h-yel: #f5c04a; --h-page: #d9d2c0; --h-shadow: rgba(0, 0, 0, .45);
  }
}
body.home { background: var(--h-bg); color: var(--h-text); }
body.home header { display: none; }
body.home main { padding-top: calc(16px + env(safe-area-inset-top)); }
.h-top { display: flex; align-items: center; gap: 12px; }
.h-ava { width: 48px; height: 48px; border-radius: 50%; background: var(--h-card); box-shadow: 0 2px 8px var(--h-shadow); }
.h-hi { flex: 1; min-width: 0; }
.h-hi b { display: block; font-family: var(--round); font-size: 21px; color: var(--h-ink); }
.h-hi span { font-size: 13px; color: var(--h-muted); }
.h-round { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--h-card); color: var(--h-ink);
  font: 700 17px var(--round); box-shadow: 0 2px 8px var(--h-shadow); cursor: pointer; }
.h-search { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.h-search .pill { flex: 1; min-width: 0; display: flex; align-items: center; height: 52px; border-radius: 26px; background: var(--h-sand); padding: 0 6px 0 18px; }
.h-search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--h-text); font-size: 16px; outline: none; }
.h-search input::placeholder { color: var(--h-muted); }
.h-clip { width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--h-muted); cursor: pointer; display: grid; place-items: center; }
.h-go { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--h-red); color: #fff; cursor: pointer;
  display: grid; place-items: center; box-shadow: 0 4px 12px color-mix(in srgb, var(--h-red) 40%, transparent); }
.h-cats { display: flex; gap: 14px; overflow-x: auto; margin: 20px -16px 0; padding: 4px 16px 8px; scrollbar-width: none; }
.h-cats::-webkit-scrollbar { display: none; }
.h-cat { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none;
  color: var(--h-muted); font: 13px/1.2 var(--sans); cursor: pointer; text-decoration: none; padding: 0; }
.h-cat .ico { width: 58px; height: 58px; border-radius: 18px; background: var(--h-card); display: grid; place-items: center; box-shadow: 0 2px 8px var(--h-shadow); }
.h-cat.off { opacity: .55; }
.h-cat:active .ico { transform: scale(.94); }
.h-sec { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 12px; }
.h-sec h2 { margin: 0; font: 700 19px var(--round); color: var(--h-ink); }
.h-sec h2 small { font-size: 14px; color: var(--h-muted); font-weight: 500; margin-left: 4px; }
.h-tools { display: flex; gap: 8px; }
.h-tools button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--h-card); color: var(--h-ink); font: 600 18px var(--round);
  box-shadow: 0 2px 6px var(--h-shadow); cursor: pointer; }
.h-tools button[hidden] { display: none; }
.h-shelf { --bw: 150px; display: grid; grid-template-columns: repeat(auto-fill, var(--bw)); justify-content: space-between; gap: 22px 12px; touch-action: pan-x pan-y; }
.h-shelf.carousel { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 6px 16px 10px; scrollbar-width: none; }
#epubMsg:empty { display: none; }
body.home .foot { font-family: var(--sans); font-size: 12px; }
.h-shelf.carousel::-webkit-scrollbar { display: none; }
.h-book { position: relative; flex: none; width: var(--bw); scroll-snap-align: start; cursor: pointer; }
.h-book:active .b3d { transform: translateY(2px); }
/* 立體書：後封板(露出書背與底邊)+書頁+前封面+書籤絲帶 */
.b3d { position: relative; width: 100%; aspect-ratio: 3 / 4.15; filter: drop-shadow(0 8px 10px var(--h-shadow)); transition: transform .15s; }
.b3d-back { position: absolute; inset: 0; border-radius: 6px 10px 10px 8px; background: var(--c2); }
.b3d-pages { position: absolute; left: 9%; right: 3%; bottom: 3.5%; height: 7%; border-radius: 0 0 6px 2px;
  background: repeating-linear-gradient(to bottom, var(--h-page) 0 2px, #ddd3bd 2px 3px); }
.b3d-front { position: absolute; left: 9%; right: 0; top: 0; bottom: 10.5%; border-radius: 3px 10px 8px 3px; overflow: hidden; background: var(--c);
  box-shadow: inset 4px 0 0 rgba(0,0,0,.12), inset -1px -1px 0 rgba(255,255,255,.12); display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 10% 8%; color: var(--fc, #fff); }
.b3d-front::before { content: ""; position: absolute; inset: 6%; border: 1.5px solid color-mix(in srgb, var(--fc, #fff) 45%, transparent); border-radius: 4px 8px 6px 4px; pointer-events: none; }
.b3d-front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.b3d-title { font-family: var(--serif); font-weight: 700; font-size: calc(var(--bw) * .13); line-height: 1.25; text-align: center; word-break: break-all;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.b3d-sub { margin-top: 8%; font-size: calc(var(--bw) * .065); opacity: .8; letter-spacing: .05em; }
.b3d-rib { position: absolute; right: 16%; bottom: -5%; width: 12%; height: 17%; background: var(--h-yel); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.h-name { margin-top: 12px; font-weight: 700; font-size: 15px; line-height: 1.35; color: var(--h-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-right: 22px; }
.h-src { font-size: 12px; color: var(--h-red); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-prog { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--h-muted); }
.h-prog .bar { flex: 1; height: 5px; margin: 0; background: var(--h-sand); border-radius: 3px; }
.h-prog .bar i { background: var(--h-ink); border-radius: 3px; }
.h-meta { font-size: 11px; color: var(--h-muted); margin-top: 4px; }
.h-meta b { color: var(--h-ink); }
