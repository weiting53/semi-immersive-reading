<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半沉浸英讀">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>半沉浸式英語閱讀</title>
<style>
:root {
  --bg: #faf7f0; --fg: #2b2620; --muted: #8a8174; --line: #e6dfd2;
  --card: #ffffff; --accent: #b4532a; --accent-bg: #f6e6dc; --known: #9aa48c;
  --serif: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
  --sans: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
:root[data-theme="sepia"] { --bg: #f1e7d0; --fg: #3b2f22; --muted: #85745c; --line: #dccdae; --card: #f8f0dd; --accent: #9c3f17; --accent-bg: #e9d4b8; }
:root[data-theme="dark"] { --bg: #16140f; --fg: #e4ddd0; --muted: #8f8676; --line: #2e2a22; --card: #211e18; --accent: #f0956a; --accent-bg: #3a2519; --known: #7f8a72; }
:root[data-theme="green"] { --bg: #e3eddc; --fg: #26301f; --muted: #6d7a62; --line: #c8d6bc; --card: #eef4e8; --accent: #3f6b2a; --accent-bg: #cfe0c2; }
:root[data-theme="black"] { --bg: #000000; --fg: #d6d3cc; --muted: #7d7a73; --line: #1f1f1f; --card: #111111; --accent: #f0956a; --accent-bg: #2a1a12; --known: #7f8a72; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --bg: #16140f; --fg: #e4ddd0; --muted: #8f8676; --line: #2e2a22; --card: #211e18; --accent: #f0956a; --accent-bg: #3a2519; --known: #7f8a72; }
}
/* 使用者自選：英文字顏色、內文字體、英文字體、行距(由 app.js 設定) */
:root { --word: var(--accent); --body-font: var(--serif); --en-font: Georgia, "Times New Roman", serif; --en-style: italic; --lh: 1.9; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 8px;
}
header .t { flex: 1; min-width: 0; }
header .book { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .chap { font-size: 15px; font-weight: 600; }
.iconbtn {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; height: 36px; min-width: 36px; padding: 0 10px; font-size: 14px; cursor: pointer;
}

main { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
main p {
  font-family: var(--body-font); font-size: var(--fs, 19px); line-height: var(--lh);
  margin: 0 0 0.9em; text-align: justify; word-break: break-word;
}
.w {
  color: var(--word); font-family: var(--en-font); font-style: var(--en-style);
  padding: 0 2px; border-radius: 4px; cursor: pointer;
  text-decoration: underline dotted; text-underline-offset: 4px;
}
.w:active, .w.on { background: color-mix(in srgb, var(--word) 20%, transparent); }
.s {
  font-family: Georgia, "Times New Roman", serif; cursor: pointer;
  border-left: 3px solid var(--accent); padding-left: 10px; display: block;
}
.s .orig { display: none; font-family: var(--serif); color: var(--muted); font-size: 0.85em; margin-top: 4px; }
.s.show .orig { display: block; }
.src { font-size: 12px; color: var(--muted); text-align: center; margin-top: 32px; word-break: break-all; }
.src a { color: var(--muted); }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}
.dock .row { max-width: 680px; margin: 0 auto; }
.dock .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.dock .lab b { color: var(--fg); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 2px; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
  border-radius: 16px 16px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .22s ease; max-height: 75vh; overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,.15);
}
.sheet.open { transform: none; }
.sheet .inner { max-width: 640px; margin: 0 auto; }
.sheet h2 { margin: 0; font-family: Georgia, serif; font-size: 28px; }
.sheet .ipa { color: var(--muted); font-size: 15px; margin: 2px 0 12px; }
.sheet .kv { font-size: 15px; line-height: 1.7; }
.sheet .kv span { color: var(--muted); display: inline-block; width: 4.5em; }
.sheet .kv .col { font-family: Georgia, serif; font-style: italic; cursor: pointer; text-decoration: underline dotted; }
.sheet .btns { display: flex; gap: 10px; margin-top: 16px; }
.sheet .btns button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; cursor: pointer; }
.sheet .btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.list { margin: 8px 0 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .en { font-family: Georgia, serif; font-size: 17px; cursor: pointer; }
[data-open] { cursor: pointer; }
.list .zh { color: var(--muted); font-size: 13px; flex: 1; }
.list li.k .en { color: var(--known); text-decoration: line-through; }
.list button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.seg { display: flex; gap: 8px; margin: 10px 0 16px; }
.seg button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; }
.seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.sub { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

/* ---- 首頁 ---- */
body.home .dock, body.home #btnWords, body.home header .t > div { display: none; }
body.home { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.hero { padding: 8px 0 4px; }
.hero h1 { margin: 0; font-family: var(--body-font); font-size: 26px; letter-spacing: .02em; }
.hero p { margin: 6px 0 14px; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
.stats b { display: block; font-size: 22px; font-family: Georgia, serif; color: var(--word); }
.stats span { font-size: 12px; color: var(--muted); }
.err { color: var(--accent); font-size: 14px; background: var(--accent-bg); padding: 10px 12px; border-radius: 10px; }
.add { display: flex; gap: 8px; margin-top: 14px; }
.add input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 0 12px; font-size: 16px; }
.add button { height: 46px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--word); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.add.epub { justify-content: center; align-items: center; height: 46px; border-radius: 12px; border: 1px dashed var(--line); color: var(--fg); font-size: 15px; cursor: pointer; margin-top: 10px; }
.shelf-h { font-size: 16px; margin: 26px 0 10px; }
.shelf { display: grid; gap: 10px; }
.bk { position: relative; display: flex; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
.bk:active { transform: scale(.99); }
.cover { flex: none; width: 56px; height: 76px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--body-font); font-size: 26px; box-shadow: inset -6px 0 0 rgba(0,0,0,.12); }
.info { flex: 1; min-width: 0; padding-right: 22px; }
.info .name { font-weight: 700; font-size: 16px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.info .where { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--word); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.chip.hot { background: color-mix(in srgb, var(--word) 14%, transparent); border-color: transparent; color: var(--word); font-weight: 600; }
.more { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.find { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--muted); }
.find .site { padding: 7px 12px; border-radius: 999px; background: color-mix(in srgb, var(--word) 14%, transparent); color: var(--word); font-weight: 600; text-decoration: none; }
.find .site.off { background: var(--card); color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.add .clip { padding: 0 12px; background: var(--card); border: 1px solid var(--line); color: var(--fg); font-weight: 400; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row2 .add.epub { margin-top: 10px; background: none; font-family: inherit; }
.field { width: 100%; margin-top: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 10px 12px; font-size: 16px; font-family: inherit; }
textarea.field { resize: vertical; line-height: 1.6; }
.empty, .foot { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <div class="t"><div class="book" id="bookTitle"></div><div class="chap" id="chapTitle"></div></div>
  <button class="iconbtn" id="btnWords" aria-label="生字本">生字本</button>
  <button class="iconbtn" id="btnAa" aria-label="閱讀設定">Aa</button>
</header>

<main id="text"></main>

<div class="dock"><div class="row">
  <div class="lab"><span>英文密度 <b id="lvName"></b></span><span id="lvStat"></span></div>
  <input type="range" id="slider" min="0" max="5" step="1" aria-label="英文密度">
  <div class="ticks"><span>原文</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
</div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetBody"></div></div>

<script src="vendor/jszip.min.js" defer></script>
<script src="vendor/opencc-cn2t.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
